<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prince Vehicle Rental | Booking Requests</title>
<style>:root{font-family:system-ui,Arial;color:#172a40;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:20px}header{background:#142b43;color:white;padding:22px;border-radius:15px}a{color:#0b8176}header a{color:#b5e8e3}section{background:white;padding:20px;margin-top:16px;border-radius:14px;border:1px solid #dce5ee}label{display:block;margin-top:13px;font-weight:650}input,textarea,button{width:100%;font:inherit;padding:11px;margin-top:5px;border-radius:8px;border:1px solid #b7c6d4}button{background:#087f76;color:white;border:0;margin-top:14px;cursor:pointer}button:disabled{opacity:.6}small{color:#53667a}li{margin:12px 0}#form,#requests{display:none}.error{color:#a12535}.ok{color:#087052}</style>
</head><body><main class="wrap"><header><a href="index.html">← Website home</a><h1>Prince Vehicle Rental</h1><p>Customer booking requests</p></header>
<section><h2>Google sign-in</h2><small>Customer portal · authentication fix v3</small><p id="authStatus" role="status">Checking sign-in…</p><button id="authBtn" type="button">Sign in with Google</button><button id="retry" type="button" style="background:#142b43">Retry sign-in check</button><p><small>Requests are not confirmed bookings. Our team must verify availability and contact you.</small></p></section>
<section id="form"><h2>Request a vehicle</h2><form id="requestForm"><label>Full name<input id="name" maxlength="120" required minlength="2" autocomplete="name"></label><label>Phone<input id="phone" maxlength="30" required autocomplete="tel"></label><label>Vehicle name or preference<input id="vehicle" maxlength="120" minlength="2" required></label><label>Start date (AD)<input id="start" type="date" required></label><label>End date (AD, inclusive)<input id="end" type="date" required></label><button type="submit" id="send">Send booking request</button></form><p id="result" role="status"></p></section>
<section id="requests"><h2>My requests</h2><button id="refresh" type="button">Refresh</button><ul id="items"></ul></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const SUPABASE_URL='https://biytfypqihcaibrgqmky.supabase.co';
const SUPABASE_KEY='sb_publishable_BFSBmvjvLMGGGOFqnW5-lw_TAWyT6gC';
const $=id=>document.getElementById(id);
let client=null,user=null,checkSequence=0;
const authWatchdog=setTimeout(()=>{if($('authStatus').textContent==='Checking sign-in…')$('authStatus').textContent='Sign-in is taking longer than expected. Tap Sign in with Google or Retry.';},7000);
const timeout=(promise,ms=12000)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Sign-in check timed out. Check your connection and tap Retry.')),ms))]);
function setUser(next){user=next;$('authStatus').textContent=user?'Signed in: '+(user.email||user.id):'Please sign in to send a request';$('authBtn').textContent=user?'Sign out':'Sign in with Google';$('form').style.display=user?'block':'none';$('requests').style.display=user?'block':'none';}
async function check(){const seq=++checkSequence;if(!client){$('authStatus').textContent='Supabase library unavailable. Check your internet connection and reload.';return;}$('authStatus').textContent='Checking sign-in…';try{const {data,error}=await timeout(client.auth.getSession());if(error)throw error;setUser(data?.session?.user||null);if(user)load();}catch(err){$('authStatus').textContent=err.message||'Sign-in check failed';$('authBtn').textContent='Sign in with Google';}}
function nextDay(iso){const date=new Date(iso+'T00:00:00Z');date.setUTCDate(date.getUTCDate()+1);return date.toISOString().slice(0,10);}
async function load(){if(!user||!client)return;const uid=user.id,list=$('items');list.textContent='Loading requests…';try{const {data,error}=await timeout(client.from('pvr_booking_requests').select('request_id,vehicle_id,start_ad,end_ad_exclusive,status,created_at').eq('requester_id',uid).order('created_at',{ascending:false}).limit(50));if(error)throw error;if(!user||user.id!==uid)return;list.replaceChildren();if(!data?.length){list.textContent='No requests yet';return;}for(const r of data){const li=document.createElement('li');const end=new Date(r.end_ad_exclusive+'T00:00:00Z');end.setUTCDate(end.getUTCDate()-1);li.textContent=`${r.vehicle_id} · ${r.start_ad} to ${end.toISOString().slice(0,10)} · ${r.status}`;list.append(li);}}catch(err){list.textContent='Unable to load requests: '+(err.message||err);}}
$('authBtn').onclick=async()=>{if(!client){$('authStatus').textContent='Supabase library unavailable';return;}const btn=$('authBtn');btn.disabled=true;try{if(user){const {error}=await timeout(client.auth.signOut());if(error)throw error;setUser(null);return;}const {error}=await timeout(client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}}));if(error)throw error;}catch(err){$('authStatus').textContent=err.message||'Sign-in failed';}finally{btn.disabled=false;}};
$('requestForm').onsubmit=async e=>{e.preventDefault();if(!user||!client)return;const start=$('start').value,end=$('end').value;if(end<start){$('result').textContent='End date must be on or after start date';$('result').className='error';return;}const btn=$('send');btn.disabled=true;try{const {error}=await timeout(client.from('pvr_booking_requests').insert({requester_id:user.id,contact_name:$('name').value.trim(),contact_phone:$('phone').value.trim(),vehicle_id:$('vehicle').value.trim(),start_ad:start,end_ad_exclusive:nextDay(end),status:'pending'}));if(error)throw error;$('result').textContent='Request received. This is NOT a confirmed booking.';$('result').className='ok';$('requestForm').reset();await load();}catch(err){$('result').textContent=err.message||'Could not send request';$('result').className='error';}finally{btn.disabled=false;}};
$('refresh').onclick=load;$('retry').onclick=check;
try{if(!window.supabase?.createClient)throw new Error('Supabase library did not load');client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT'||event==='INITIAL_SESSION'){setUser(session?.user||null);if(session?.user)load();}});check();}catch(err){$('authStatus').textContent=err.message;}
</script></body></html>
