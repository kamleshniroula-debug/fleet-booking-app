<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prince Vehicle Rental | Booking Requests (Auth Fix 5)</title><style>
:root{font-family:system-ui,Arial;color:#172a40;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:20px}header{background:#142b43;color:white;padding:22px;border-radius:15px}a{color:#0b8176}header a{color:#b5e8e3}section{background:white;padding:20px;margin-top:16px;border-radius:14px;border:1px solid #dce5ee}label{display:block;margin-top:13px;font-weight:650}input,select,textarea,button{width:100%;font:inherit;padding:11px;margin-top:5px;border-radius:8px;border:1px solid #b7c6d4}button{background:#087f76;color:white;border:0;margin-top:14px;cursor:pointer}button:disabled{opacity:.6}small{color:#53667a}li{margin:12px 0}#form,#requests{display:none}.error{color:#a12535}.ok{color:#087052}</style></head><body><main class="wrap"><header><a href="index.html">← Website home</a><h1>Prince Vehicle Rental</h1><p>Customer booking requests</p></header><section><h2>Google sign-in</h2><p id="authStatus" role="status">Checking sign-in…</p><button id="retryAuth" type="button" style="background:#142b43">Retry sign-in check</button><button id="authBtn">Sign in with Google</button><p><small>Requests are not confirmed bookings. Our team must verify availability and contact you.</small></p></section><section id="form"><h2>Request a vehicle</h2><form id="requestForm"><label>Full name<input id="name" maxlength="120" required minlength="2" autocomplete="name"></label><label>Phone<input id="phone" maxlength="30" required autocomplete="tel"></label><label>Choose vehicle<select id="vehicle" required><option value="">Loading available vehicles…</option></select></label><p id="vehicleStatus"><small>Loading vehicle list…</small></p><label>Start date (AD)<input id="start" type="date" required></label><label>End date (AD, inclusive)<input id="end" type="date" required></label><label>Notes<textarea id="notes" maxlength="1000" rows="3"></textarea></label><button type="submit" id="send">Send booking request</button></form><p id="result" role="status"></p></section><section id="requests"><h2>My requests</h2><button id="refresh">Refresh</button><ul id="items"></ul></section></main><script>window.addEventListener('error',function(e){var el=document.getElementById('authStatus');if(el)el.textContent='Page script error: '+(e.message||'unknown error');});setTimeout(function(){var el=document.getElementById('authStatus');if(el&&el.textContent.includes('Checking sign-in'))el.textContent='Login initialization timed out. The page may be cached or the authentication script failed.';},9000);</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';const URL='https://biytfypqihcaibrgqmky.supabase.co',KEY='sb_publishable_BFSBmvjvLMGGGOFqnW5-lw_TAWyT6gC';const $=id=>document.getElementById(id);let client=null;try{if(window.supabase?.createClient)client=window.supabase.createClient(URL,KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});}catch(e){document.getElementById('authStatus').textContent='Authentication initialization failed: '+e.message;}
 let user=null, authReady=false, authTimer=null, lastUserId=null;
 const AUTH_TIMEOUT=12000;
 function timeout(promise,ms,label){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label)),ms))]);}
 function authFailure(e){authReady=true;if(authTimer)clearTimeout(authTimer);setAuthMessage((e?.message||String(e))+' — Try Google sign-in again.');$('authBtn').disabled=false;}
 function setAuthMessage(message){$('authStatus').textContent=message}
 function showSession(session){
   const nextUser=session?.user||null, nextId=nextUser?.id||null;
   user=nextUser;authReady=true;
   if(authTimer)clearTimeout(authTimer);
   setAuthMessage(user?'Signed in: '+(user.email||user.id):'Please sign in to send a request');
   $('authBtn').textContent=user?'Sign out':'Sign in with Google';
   $('form').style.display=user?'block':'none';$('requests').style.display=user?'block':'none';
   if(user&&lastUserId!==nextId){
     setTimeout(()=>{loadVehicles().catch(e=>$('vehicleStatus').textContent=e.message);load().catch(e=>$('items').textContent=e.message)},0);
   }
   lastUserId=nextId;
 }
 function beginAuthWait(){
   if(authTimer)clearTimeout(authTimer);
   authReady=false;
   setAuthMessage('Checking sign-in…');
   authTimer=setTimeout(()=>{
     if(!authReady){setAuthMessage('Sign-in check timed out. Tap Sign in with Google, or retry.');$('authBtn').disabled=false;}
   },AUTH_TIMEOUT);
 }
 async function check(){
   if(!client){setAuthMessage('Supabase library unavailable. Check internet connection and reload.');return}
   beginAuthWait();
   try{
     const {data,error}=await timeout(client.auth.getSession(),AUTH_TIMEOUT,'Session check timed out');
     if(error)throw error;
     showSession(data?.session);
   }catch(e){authFailure(e)}
 }
 $('retryAuth').onclick=check;
 $('authBtn').onclick=async()=>{
   try{
     if(!client)throw Error('Supabase library unavailable');
     $('authBtn').disabled=true;
     if(user){
       const {error}=await timeout(client.auth.signOut(),AUTH_TIMEOUT,'Sign-out timed out');if(error)throw error;
       showSession(null);return;
     }
     setAuthMessage('Opening Google sign-in…');
     const {error}=await timeout(client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}}),AUTH_TIMEOUT,'Google sign-in could not start');
     if(error)throw error;
   }catch(e){authFailure(e)}
   finally{$('authBtn').disabled=false}
 };
async function loadVehicles(){const select=$('vehicle'),status=$('vehicleStatus');select.replaceChildren(new Option('Select a vehicle',''));const {data,error}=await client.from('pvr_public_vehicles').select('vehicle_id,display_name').eq('active',true).order('display_name');if(error){status.textContent='Unable to load vehicles: '+error.message;return}const excluded=new Set(['kia sonet','sonet','toyota','tata punch']);for(const v of data||[]){if(v.vehicle_id&&v.display_name&&!excluded.has(v.display_name.trim().toLowerCase()))select.add(new Option(v.display_name,v.vehicle_id))}status.textContent=select.options.length>1?'Select a vehicle from the current fleet.':'No vehicles are currently available.'}
$('requestForm').onsubmit=async e=>{e.preventDefault();if(!user)return;const start=$('start').value,end=$('end').value;const vehicleSelect=$('vehicle'),vehicleId=vehicleSelect.value,vehicleName=vehicleSelect.selectedOptions[0]?.textContent||'';if(!vehicleId){$('result').textContent='Please select a vehicle';$('result').className='error';return}if(end<start){$('result').textContent='End date must be on or after start date';return}const btn=$('send');btn.disabled=true;try{const {error}=await client.from('pvr_booking_requests').insert({customer_id:user.id,customer_name:$('name').value.trim(),contact_phone:$('phone').value.trim(),vehicle_id:vehicleId,vehicle_name:vehicleName,start_date:start,end_date:end,notes:$('notes').value.trim()});if(error)throw error;$('result').textContent='Request received. It is NOT a confirmed booking.';$('result').className='ok';$('requestForm').reset();await load()}catch(err){$('result').textContent=err.message;$('result').className='error'}finally{btn.disabled=false}};
async function load(){const {data,error}=await client.from('pvr_booking_requests').select('vehicle_name,start_date,end_date,status,created_at').eq('customer_id',user.id).order('created_at',{ascending:false}).limit(50);const list=$('items');list.replaceChildren();if(error){list.textContent=error.message;return}if(!data?.length){list.textContent='No requests yet';return}for(const r of data){const li=document.createElement('li');li.textContent=`${r.vehicle_name} · ${r.start_date} to ${r.end_date} · ${r.status}`;list.append(li)}}$('refresh').onclick=load;
 // Auth event handlers must return immediately; avoid awaiting Supabase API calls inside them.
 if(client){
   beginAuthWait();
   const params=new URLSearchParams(location.search);
   const oauthError=params.get('error_description')||params.get('error');
   if(oauthError){authFailure(new Error(oauthError));}
   try{
     client.auth.onAuthStateChange((event,session)=>{
       if(['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT','TOKEN_REFRESHED','USER_UPDATED'].includes(event)){
         showSession(session);
       }
     });
     // Some browsers do not deliver INITIAL_SESSION promptly. Explicit fallback.
     setTimeout(()=>{if(!authReady)check()},2500);
   }catch(e){authFailure(e)}
 }else{
   setAuthMessage('Supabase library unavailable. Check your connection and reload.');
 }
 </script></body></html>
