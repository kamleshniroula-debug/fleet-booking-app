<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prince Vehicle Rental | Staff Requests</title><style>:root{font-family:system-ui,Arial;background:#f3f6fa;color:#183149}body{margin:0}.wrap{max-width:820px;margin:auto;padding:18px}header{background:#142b43;color:white;padding:20px;border-radius:14px}section{background:white;padding:18px;margin-top:16px;border-radius:12px}button{border:0;border-radius:8px;background:#087f76;color:white;padding:10px;margin:4px;cursor:pointer}button:disabled{opacity:.5}.entry{padding:12px;border-bottom:1px solid #dde5ed}small{color:#526477}header a{color:#aee5de}</style></head><body><main class="wrap"><header><a href="index.html">← Website home</a><h1>Prince Vehicle Rental</h1>Staff booking-request review</header><section><p id="status">Checking permissions…</p><button id="login">Sign in with Google</button></section><section id="panel" hidden><h2>Customer requests</h2><p><small>Reviewing a request does not create a confirmed booking. Check dates in the fleet booking calendar before promising a vehicle.</small></p><button id="refresh">Refresh requests</button><div id="items"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';const $=id=>document.getElementById(id),client=window.supabase?.createClient('https://biytfypqihcaibrgqmky.supabase.co','sb_publishable_BFSBmvjvLMGGGOFqnW5-lw_TAWyT6gC',{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});let user=null;async function check(){if(!client){$('status').textContent='Supabase unavailable';return}const {data:{session}}=await client.auth.getSession();user=session?.user||null;$('login').textContent=user?'Sign out':'Sign in with Google';$('panel').hidden=true;if(!user){$('status').textContent='Sign in first';return}const {data,error}=await client.from('pvr_members').select('role,active').eq('user_id',user.id).maybeSingle();if(error||!data?.active||!['admin','staff'].includes(data.role)){$('status').textContent='Access denied: active staff or administrator required';return}$('status').textContent='Verified '+data.role;$('panel').hidden=false;await load()}
$('login').onclick=async()=>{if(!client)return;if(user){await client.auth.signOut();await check();return}const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)$('status').textContent=error.message};async function load(){const el=$('items');el.textContent='Loading…';const {data,error}=await client.from('pvr_booking_requests').select('request_id,requester_id,contact_name,contact_phone,vehicle_id,start_ad,end_ad_exclusive,status,created_at').order('created_at',{ascending:false}).limit(100);el.replaceChildren();if(error){el.textContent=error.message;return}if(!data?.length){el.textContent='No requests';return}for(const r of data){const d=document.createElement('div');d.className='entry';const p=document.createElement('p');p.textContent=`${r.contact_name} · ${r.contact_phone} · Vehicle: ${r.vehicle_id} · ${r.start_ad} to ${r.end_ad_exclusive} (end exclusive) · ${r.status}`;d.append(p);if(r.status==='pending'){for(const status of ['approved','rejected']){const b=document.createElement('button');b.textContent=status==='approved'?'Mark reviewed':'Reject';b.onclick=async()=>{if(!confirm('Set request to '+status+'? This does NOT reserve the vehicle.'))return;b.disabled=true;const {error}=await client.rpc('pvr_review_booking_request',{p_request_id:r.request_id,p_status:status});if(error){alert(error.message);b.disabled=false}else await load()};d.append(b)}}el.append(d)}}$('refresh').onclick=load;if(client)client.auth.onAuthStateChange(()=>setTimeout(check,0));check();
</script></body></html>
